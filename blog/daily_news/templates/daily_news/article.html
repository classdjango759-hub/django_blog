{% extends "daily_news/base.html" %} {% block content %}
<style>
  /* --- Shared Color Palette & Variables --- */
  :root {
    --bg-color: #0d0d0f;
    /* Deep obsidian background */
    --card-bg: rgba(255, 255, 255, 0.03);
    /* Glass backdrop */
    --text-primary: #e8e6e1;
    /* Soft champagne text */
    --text-muted: #949086;
    /* Warm muted grey */
    --accent: #d4a373;
    /* Champagne / Muted gold */
    --accent-glow: rgba(212, 163, 115, 0.15);
    --border-color: rgba(255, 255, 255, 0.07);

    --font-display: "Italiana", serif;
    --font-sans: "Plus Jakarta Sans", sans-serif;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-primary);
    font-family: var(--font-sans);
    line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    background-image:
      radial-gradient(
        circle at 20% 10%,
        rgba(212, 163, 115, 0.08) 0%,
        transparent 40%
      ),
      radial-gradient(
        circle at 80% 70%,
        rgba(138, 100, 70, 0.05) 0%,
        transparent 50%
      );
    background-attachment: fixed;
  }

  a {
    color: inherit;
    text-decoration: none;
    transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* --- Header --- */
  .header {
    max-width: 800px;
    margin: 0 auto;
    padding: 4rem 2rem 2rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .brand {
    font-family: var(--font-display);
    font-size: 2.2rem;
    letter-spacing: 1px;
    color: var(--text-primary);
  }

  .nav-links {
    display: flex;
    gap: 2.5rem;
    list-style: none;
  }

  .nav-links a {
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    font-weight: 500;
  }

  .nav-links a:hover {
    color: var(--accent);
  }

  /* --- Article Container --- */
  .article-container {
    max-width: 800px;
    margin: 0 auto;
    padding: 2rem 2rem 6rem;
  }

  /* Back Button */
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.75rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 3rem;
    font-weight: 500;
  }

  .back-link:hover {
    color: var(--accent);
    transform: translateX(-4px);
  }

  /* --- Article Header Section --- */
  .article-header {
    margin-bottom: 3.5rem;
    border-bottom: 1px solid var(--border-color);
    padding-bottom: 2.5rem;
  }

  /* Property 1: Headline */
  .article-title {
    font-family: var(--font-display);
    font-size: 3.2rem;
    line-height: 1.15;
    font-weight: 400;
    color: var(--text-primary);
    margin-bottom: 1.5rem;
    letter-spacing: 0.5px;
  }

  /* Properties 2 & 3: Author & Published At */
  .article-meta {
    display: flex;
    align-items: center;
    gap: 1.25rem;
    font-size: 0.85rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 1.5px;
  }

  .article-meta .author {
    color: var(--accent);
    font-weight: 600;
  }

  .article-meta .dot {
    font-size: 0.5rem;
    opacity: 0.4;
  }

  /* --- Property 4: Full Article Body --- */
  .article-body {
    font-size: 1.05rem;
    color: var(--text-primary);
    font-weight: 300;
    line-height: 1.95;
    display: flex;
    flex-direction: column;
    gap: 1.8rem;
  }

  .article-body p::first-letter {
    font-family: var(--font-display);
    font-size: 3.5rem;
    float: left;
    line-height: 0.8;
    margin-right: 0.8rem;
    margin-top: 0.2rem;
    color: var(--accent);
  }

  .article-body blockquote {
    font-family: var(--font-display);
    font-size: 1.8rem;
    line-height: 1.35;
    color: var(--accent);
    border-left: 1px solid var(--accent);
    padding-left: 2rem;
    margin: 2rem 0;
    font-style: italic;
  }

  .article-body h3 {
    font-family: var(--font-display);
    font-size: 1.8rem;
    color: var(--text-primary);
    margin-top: 1.5rem;
    font-weight: 400;
  }

  /* --- Author Bio Card --- */
  .author-box {
    background: var(--card-bg);
    border: 1px solid var(--border-color);
    border-radius: 16px;
    padding: 2.5rem;
    margin-top: 4rem;
    backdrop-filter: blur(12px);
    display: flex;
    gap: 1.5rem;
    align-items: center;
  }

  .author-avatar {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #523a27);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 1.4rem;
    color: #0d0d0f;
    font-weight: 600;
    flex-shrink: 0;
  }

  .author-details h4 {
    font-family: var(--font-display);
    font-size: 1.25rem;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
  }

  .author-details p {
    font-size: 0.85rem;
    color: var(--text-muted);
    font-weight: 300;
  }

  /* --- Footer --- */
  .footer {
    text-align: center;
    padding: 4rem 1.5rem;
    border-top: 1px solid var(--border-color);
    font-size: 0.8rem;
    color: var(--text-muted);
    letter-spacing: 1px;
    font-weight: 300;
  }

  /* --- Responsive Design --- */
  @media (max-width: 768px) {
    .article-title {
      font-size: 2.2rem;
    }

    .article-container {
      padding: 1.5rem 1.5rem 4rem;
    }

    .author-box {
      flex-direction: column;
      align-items: flex-start;
      padding: 1.75rem;
    }
  }
</style>

<!-- Article Content Area -->
<main class="article-container">
  <!-- Back Link -->
  <a href="#" class="back-link">← Back to Articles</a>

  <!-- Article Header -->
  <header class="article-header">
    <!-- 1. Headline -->
    <h1 class="article-title">{{blog.headline}}</h1>

    <!-- 2 & 3. Author & Published At -->
    <div class="article-meta">
      <span class="author">{{blog.author}}</span>
      <span class="dot">•</span>
      <time datetime="2026-09-08">{{blog.published_at}}</time>
      <span class="dot">•</span>
      <span>6 min read</span>
    </div>
  </header>

  <!-- 4. Full Body Content -->
  <article class="article-body">
    <p>{{blog.body}}</p>
  </article>

  <!-- Author Bio Box -->
  <section class="author-box" style="flex-direction: row; align-items: center;">
    <div style="display: flex; gap: 5px; align-items: center">
      <img
        class="author-avatar"
        src="https://picsum.photos/200/300"
        width="100"
        height="100"
      />
      <div class="author-details">
        <h4>{{blog.author}}</h4>
      </div>
    </div>

    <div style="display: flex; gap: 1em;">
      {% if user.is_authenticated and user == blog.author %}
      <form
        method="post"
        action="{% url 'delete-blog' blog.pk %}"
        onsubmit="return confirm('Are you sure about deleting this post?');"
      >
        {% csrf_token %}
        <button style="background: transparent; color: red; border: none">
          Delete
        </button>
      </form>
      <a href="{% url 'edit-blog' blog.pk %}">Edit</a>
      {% endif %}
    </div>
  </section>
</main>
{% endblock %}
