<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aesthetic Journal</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Italiana&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <style>
      /* --- Color Palette & Variables --- */
      :root {
        --bg-color: #0d0d0f;
        /* Deep obsidian dark background */
        --card-bg: rgba(255, 255, 255, 0.03);
        /* Translucent glass card background */
        --card-hover-bg: rgba(255, 255, 255, 0.05);
        --text-primary: #e8e6e1;
        /* Soft champagne light text */
        --text-muted: #949086;
        /* Warm muted grey */
        --accent: #d4a373;
        /* Muted gold / Champagne accent */
        --accent-glow: rgba(212, 163, 115, 0.15);
        --border-color: rgba(255, 255, 255, 0.07);
        --border-hover: rgba(212, 163, 115, 0.35);

        --font-display: "Italiana", serif;
        --font-sans: "Plus Jakarta Sans", sans-serif;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: var(--font-sans);
        line-height: 1.8;
        -webkit-font-smoothing: antialiased;
        min-height: 100vh;
        /* Ambient background glowing orbs */
        background-image:
          radial-gradient(
            circle at 15% 20%,
            rgba(212, 163, 115, 0.06) 0%,
            transparent 45%
          ),
          radial-gradient(
            circle at 85% 80%,
            rgba(138, 100, 70, 0.05) 0%,
            transparent 50%
          );
        background-attachment: fixed;
      }

      a {
        color: inherit;
        text-decoration: none;
        transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* --- Stylish Header --- */
      .header {
        max-width: 960px;
        margin: 0 auto;
        padding: 4rem 2rem 3rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
      }

      .brand {
        font-family: var(--font-display);
        font-size: 2.2rem;
        letter-spacing: 1px;
        color: var(--text-primary);
      }

      .nav-links {
        display: flex;
        gap: 2.5rem;
        list-style: none;
      }

      .nav-links a {
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 500;
      }

      .nav-links a:hover {
        color: var(--accent);
      }

      /* --- Container --- */
      .container {
        max-width: 960px;
        margin: 0 auto;
        padding: 4rem 2rem 6rem;
      }

      .content-grid {
        display: grid;
        grid-template-columns: 1fr 280px;
        gap: 4.5rem;
      }

      /* --- Blog Feed --- */
      .posts-feed {
        display: flex;
        flex-direction: column;
        gap: 3rem;
      }

      .post-card {
        background: var(--card-bg);
        border: 1px solid var(--border-color);
        padding: 3rem;
        border-radius: 20px;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        position: relative;
        overflow: hidden;
      }

      /* Subtle glow line at top of cards on hover */
      .post-card::before {
        content: "";
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          var(--accent),
          transparent
        );
        opacity: 0;
        transition: opacity 0.4s ease;
      }

      .post-card:hover {
        background: var(--card-hover-bg);
        border-color: var(--border-hover);
        transform: translateY(-4px);
        box-shadow:
          0 20px 40px rgba(0, 0, 0, 0.4),
          0 0 30px var(--accent-glow);
      }

      .post-card:hover::before {
        opacity: 1;
      }

      /* Headline */
      .post-card h2 {
        font-family: var(--font-display);
        font-size: 2.4rem;
        line-height: 1.25;
        font-weight: 400;
        margin-bottom: 1rem;
        color: var(--text-primary);
        letter-spacing: 0.5px;
      }

      /* Author & Published At Meta */
      .post-meta {
        font-size: 0.8rem;
        color: var(--text-muted);
        display: flex;
        gap: 0.6rem;
        align-items: center;
        margin-bottom: 1.5rem;
        text-transform: uppercase;
        letter-spacing: 1.5px;
      }

      .post-meta .author {
        color: var(--accent);
        font-weight: 600;
      }

      .post-meta .dot {
        font-size: 0.5rem;
        opacity: 0.4;
      }

      /* Body Excerpt */
      .post-body {
        font-size: 0.95rem;
        color: var(--text-muted);
        font-weight: 300;
        line-height: 1.8;
        margin-bottom: 2rem;
      }

      /* Read More Button */
      .post-footer {
        display: flex;
        align-items: center;
      }

      .read-more {
        display: inline-flex;
        align-items: center;
        gap: 0.75rem;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: var(--text-primary);
        padding: 0.6rem 1.2rem;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--border-color);
        transition: all 0.3s ease;
      }

      .read-more .arrow {
        font-size: 1rem;
        transition: transform 0.3s ease;
      }

      .post-card:hover .read-more {
        background: var(--accent);
        color: #0d0d0f;
        border-color: var(--accent);
        box-shadow: 0 0 15px var(--accent-glow);
      }

      .post-card:hover .read-more .arrow {
        transform: translateX(4px);
      }

      /* --- Sidebar Widgets --- */
      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 3rem;
      }

      .widget-title {
        font-family: var(--font-display);
        font-size: 1.4rem;
        letter-spacing: 1px;
        margin-bottom: 1.2rem;
        padding-bottom: 0.5rem;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-primary);
      }

      .about-widget p {
        font-size: 0.875rem;
        color: var(--text-muted);
        font-weight: 300;
        line-height: 1.8;
      }

      .newsletter-widget p {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 1.25rem;
        font-weight: 300;
      }

      .newsletter-form input {
        width: 100%;
        padding: 0.9rem 1.1rem;
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--border-color);
        border-radius: 12px;
        font-family: inherit;
        font-size: 0.85rem;
        color: var(--text-primary);
        margin-bottom: 0.75rem;
        outline: none;
        transition: all 0.3s ease;
      }

      .newsletter-form input:focus {
        border-color: var(--accent);
        background: rgba(255, 255, 255, 0.06);
      }

      .newsletter-form button {
        width: 100%;
        padding: 0.9rem;
        background: var(--accent);
        color: #0d0d0f;
        border: none;
        border-radius: 12px;
        font-size: 0.75rem;
        letter-spacing: 2px;
        text-transform: uppercase;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .newsletter-form button:hover {
        opacity: 0.9;
        box-shadow: 0 0 20px var(--accent-glow);
      }

      /* --- Footer --- */
      .footer {
        text-align: center;
        padding: 4rem 1.5rem;
        border-top: 1px solid var(--border-color);
        font-size: 0.8rem;
        color: var(--text-muted);
        letter-spacing: 1px;
        font-weight: 300;
      }

      /* --- Responsive Design --- */
      @media (max-width: 800px) {
        .content-grid {
          grid-template-columns: 1fr;
          gap: 4rem;
        }

        .post-card {
          padding: 2rem;
        }

        .post-card h2 {
          font-size: 1.9rem;
        }

        .header {
          padding-top: 2.5rem;
        }
      }
    </style>
  </head>

  <body>
    <!-- Header Navigation -->
    <header class="header">
      <div class="brand">
        <a href="{% url 'home' %}"> DJANGO. </a>
      </div>
      <ul class="nav-links">
        {% if user.is_authenticated %}
            <li><a href="{% url 'create-blog' %}">Create</a></li>
            <li><a href="{% url 'profile' %}">Profile</a></li>
            <form method='post' action="{% url 'logout' %}">
              {% csrf_token %}
              <button type="submit">Logout</button>
            </form>
        {% else %}
            <li><a href="{% url 'login' %}">Login</a></li>
            <li><a href="{% url 'register' %}">Register</a></li>
        {% endif %}

      </ul>
    </header>

    {% block content %} {%endblock%}
    <!-- Footer -->
    <footer class="footer">
      <p>&copy; 2026 LUMEN JOURNAL. ALL RIGHTS RESERVED.</p>
    </footer>
  </body>
</html>
